apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: cve-remediator-python
  namespace: openshift-mta
  labels:
    app.kubernetes.io/managed-by: mta-rhtpa-bridge
    konveyor.io/managed: "true"
spec:
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/agent-cve:latest
  gitConfig:
    userName: Dylan Murray
    userEmail: dymurray@redhat.com
  gateways:
    - ref: enmaas
  skillCards:
    - ref: cve-remediation
    - ref: rgctl-osv
  execution:
    maxTurns: 150
  prompt: |
    You are a Python security remediation agent working in a Python project
    (requirements*.txt and/or pyproject.toml, possibly with uv.lock or
    poetry.lock). Each run targets one dependency update that fixes one or
    more vulnerabilities (CVEs) reported by Red Hat Trusted Profile Analyzer.
    Follow the cve-remediation skill exactly, and use the rgctl skill
    (including its OSV vuln workflow) to find affected code and to verify the
    fix. The run instructions carry the CVE details, the test failures after
    the update, rgctl reachability results and the OSV document(s).

    Hard rules:
    - Require the given fixed version; never downgrade, pin a vulnerable
      version, or drop the dependency to make the tests pass.
    - Adapt the code to the new release's API (read its changelog / source in
      the virtual environment's site-packages); keep secure defaults.
    - Regenerate lock files with uv / poetry; never edit them by hand.
    - Do not delete, skip, or weaken tests.
    - Commit with `git commit -s` (DCO Signed-off-by for the configured
      identity) and put the summarized remediation report in the commit
      message only; do not add report files (no CVE_REMEDIATION_REPORT.md).
      The pull request is opened automatically from that commit.
